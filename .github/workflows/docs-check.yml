name: Portfolio quality checks

on:
  push:
    paths:
      - '**/*.md'
      - 'data/**/*.json'
      - 'scripts/**/*.mjs'
      - 'package.json'
      - '.github/workflows/docs-check.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'data/**/*.json'
      - 'scripts/**/*.mjs'
      - 'package.json'
      - '.github/workflows/docs-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-portfolio:
    name: Test, links, anchors, catalog and safety
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test and validate the portfolio
        run: npm run check
