name: Portfolio quality checks

on:
  push:
    paths:
      - '**/*.md'
      - 'data/**/*.json'
      - 'scripts/**/*.mjs'
      - 'web/**'
      - 'package.json'
      - '.github/workflows/docs-check.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'data/**/*.json'
      - 'scripts/**/*.mjs'
      - 'web/**'
      - 'package.json'
      - '.github/workflows/docs-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-portfolio:
    name: Tests, static documentation checks and web structure
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check browser module syntax
        run: |
          node --check web/app.mjs
          node --check web/project-search.mjs
          node --check web/project-view.mjs
      - name: Test and validate portfolio
        run: npm run check
