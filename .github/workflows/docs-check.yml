name: Portfolio documentation checks

on:
  push:
    paths:
      - '**/*.md'
      - 'data/**/*.json'
      - 'package.json'
      - 'scripts/check-markdown-links.mjs'
      - 'scripts/check-markdown-links.test.mjs'
      - 'scripts/check-markdown-anchors.mjs'
      - 'scripts/check-markdown-anchors.test.mjs'
      - 'scripts/check-project-catalog.mjs'
      - 'scripts/check-project-catalog.test.mjs'
      - '.github/workflows/docs-check.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'data/**/*.json'
      - 'package.json'
      - 'scripts/check-markdown-links.mjs'
      - 'scripts/check-markdown-links.test.mjs'
      - 'scripts/check-markdown-anchors.mjs'
      - 'scripts/check-markdown-anchors.test.mjs'
      - 'scripts/check-project-catalog.mjs'
      - 'scripts/check-project-catalog.test.mjs'
      - '.github/workflows/docs-check.yml'

permissions:
  contents: read

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test documentation and catalog
        run: npm run check
